name: Kalshi tennis bot

# Public repo: logs are public. The bot prints counts only, uploads no
# artifacts and uses no Actions cache — all state lives in a private repo.
# No pull_request trigger, so fork PRs never run with secrets.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      betting_mode:
        description: 'Override BETTING_MODE for this run (blank = repo variable)'
        type: choice
        options: ['', 'off', 'dry_run', 'live']
        default: ''
      bot_policy:
        description: 'Override BOT_POLICY for this run (blank = repo variable)'
        type: choice
        options: ['', 'taker', 'maker']
        default: ''
      kalshi_env:
        description: 'Run this one against DEMO (blank = repo variable); a manual run can never select prod'
        type: choice
        options: ['', 'demo']
        default: ''
      kalshi_probe:
        description: 'Only run the DEMO order-path probe'
        type: boolean
        default: false
      kalshi_maker_probe:
        description: 'Only run the DEMO maker order-path probe (rest, expire, cancel, post-only, fill read-back)'
        type: boolean
        default: false
      maker_probe_args:
        description: 'Extra args for the DEMO maker probe (e.g. --variants)'
        type: choice
        options: ['', '--variants']
        default: ''

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bet:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run tests
        run: python3 -m pytest tests -q

      - name: Bet
        if: github.event.inputs.kalshi_probe != 'true' && github.event.inputs.kalshi_maker_probe != 'true'
        env:
          KALSHI_ENV: ${{ github.event.inputs.kalshi_env || vars.KALSHI_ENV || 'demo' }}
          BETTING_MODE: ${{ github.event.inputs.betting_mode || vars.BETTING_MODE || 'dry_run' }}
          BOT_POLICY: ${{ github.event.inputs.bot_policy || vars.BOT_POLICY || 'taker' }}
          MAKER_STOP_HOURS: ${{ vars.MAKER_STOP_HOURS || '4' }}
          # Secrets, not vars: step env values from vars print in public logs.
          KALSHI_START_BANKROLL: ${{ secrets.KALSHI_START_BANKROLL }}
          STATE_REPO: ${{ secrets.STATE_REPO }}
          BOT_STATE_TOKEN: ${{ secrets.BOT_STATE_TOKEN }}
          PROD_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          PROD_PEM: ${{ secrets.KALSHI_PRIVATE_KEY }}
          DEMO_KEY_ID: ${{ secrets.KALSHI_DEMO_KEY_ID }}
          DEMO_PEM: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
        run: |
          set -o pipefail
          KALSHI_ENV="$(printf '%s' "$KALSHI_ENV" | tr '[:upper:]' '[:lower:]')"
          export KALSHI_ENV
          if [ "$KALSHI_ENV" = "prod" ]; then KEY_ID="$PROD_KEY_ID"; PEM="$PROD_PEM"; else KEY_ID="$DEMO_KEY_ID"; PEM="$DEMO_PEM"; fi
          umask 077
          trap 'rm -f "$RUNNER_TEMP/kalshi.pem"' EXIT
          printf '%s\n' "$PEM" > "$RUNNER_TEMP/kalshi.pem"
          export KALSHI_API_KEY_ID="$KEY_ID" KALSHI_PRIVATE_KEY_PATH="$RUNNER_TEMP/kalshi.pem"
          python3 -m kalshi_bot.bettor

      - name: Demo probe
        if: github.event.inputs.kalshi_probe == 'true'
        env:
          KALSHI_ENV: demo
          DEMO_KEY_ID: ${{ secrets.KALSHI_DEMO_KEY_ID }}
          DEMO_PEM: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
        run: |
          set -o pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/kalshi.pem"' EXIT
          printf '%s\n' "$DEMO_PEM" > "$RUNNER_TEMP/kalshi.pem"
          export KALSHI_API_KEY_ID="$DEMO_KEY_ID" KALSHI_PRIVATE_KEY_PATH="$RUNNER_TEMP/kalshi.pem"
          python3 -m kalshi_bot.probe

      - name: Demo maker probe
        if: github.event.inputs.kalshi_maker_probe == 'true'
        env:
          KALSHI_ENV: demo
          PROBE_ARGS: ${{ github.event.inputs.maker_probe_args }}
          DEMO_KEY_ID: ${{ secrets.KALSHI_DEMO_KEY_ID }}
          DEMO_PEM: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
        run: |
          set -o pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/kalshi.pem"' EXIT
          printf '%s\n' "$DEMO_PEM" > "$RUNNER_TEMP/kalshi.pem"
          export KALSHI_API_KEY_ID="$DEMO_KEY_ID" KALSHI_PRIVATE_KEY_PATH="$RUNNER_TEMP/kalshi.pem"
          if [ "$PROBE_ARGS" = "--variants" ]; then python3 -m kalshi_bot.maker_probe --variants; else python3 -m kalshi_bot.maker_probe; fi
